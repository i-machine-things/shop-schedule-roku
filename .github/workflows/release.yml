name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point at a commit on main. Per .claude/CLAUDE.md Rule 4, only tag from main." >&2
            exit 1
          fi

      - name: Package channel zip
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p build
          zip -r "build/shop-schedule-roku-${RELEASE_TAG}.zip" \
            manifest components source images media \
            -x '*.bak'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/shop-schedule-roku-${{ github.ref_name }}.zip
          generate_release_notes: true
